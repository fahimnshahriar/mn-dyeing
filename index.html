<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Dyeing Program Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--card:#f3f4f6;--line:#d8dbe0;--acc:#0b6bcb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#eceef1;--mut:#9aa0a8;--card:#1f2226;--line:#33373d;--acc:#5aa9ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171a;--fg:#eceef1;--mut:#9aa0a8;--card:#1f2226;--line:#33373d;--acc:#5aa9ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:14px;max-width:640px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:15px;margin:16px 0 8px;color:var(--mut)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
textarea{font:16px system-ui;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);width:100%;box-sizing:border-box;resize:vertical}
.lg{font-size:11px;color:var(--mut);margin-top:3px}
input,select{font:16px system-ui;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);width:100%;box-sizing:border-box}
.tot{background:var(--acc);color:#fff;border-radius:12px;padding:12px;margin:14px 0;display:flex;justify-content:space-between;font-weight:600}
.st{background:var(--card);border-radius:10px;padding:10px;margin-bottom:8px}
.st b{display:block}.t{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:3px}
.p{font-size:12px;color:var(--mut);margin-top:4px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button,.bt{font:600 13px system-ui;padding:9px 4px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}.tabs button{flex:1}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.ps{display:none;font-size:13px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}td,th{border:1px solid var(--line);padding:6px;text-align:left}table input{padding:5px;font-size:14px}th{background:var(--card)}
.er{background:var(--card);border-radius:10px;padding:8px;margin-bottom:8px}.er .g{margin-top:6px}.bs{display:flex;gap:6px;margin-top:6px}.bs .bt{flex:1}.as{margin:0 0 8px;font-weight:600}
[hidden]{display:none!important}#gr{margin:8px 0;color:var(--fg)}#gr svg{width:100%;height:auto;display:block;background:var(--card);border-radius:10px}
.fh{font-size:13px;font-weight:700;color:var(--acc);margin:14px 0 6px;border-bottom:1px solid var(--line);padding-bottom:3px}.mvs{font-size:12px;padding:6px}
@page{size:A4;margin:8mm}
@media print{html,body{background:#fff!important;color:#000!important}body{padding:0;max-width:none;font-size:9.5pt;line-height:1.2}:root{padding:0}
h1{font-size:13pt;margin:0 0 3px}.tabs,#calc .g,.no{display:none!important}
.ps{display:block;font-size:8.5pt;margin:0 0 3px;color:#000}
.tot{background:none;color:#000;border:1px solid #000;border-radius:3px;padding:2px 6px;margin:0 0 4px;font-size:10pt}
.st{background:none;border:0;border-bottom:1px solid #999;border-radius:0;color:#000;break-inside:avoid;margin:0;padding:2px 3px;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px}
.st b{display:inline;flex:1 1 50%;font-size:9.5pt}
.st .t{flex:0 0 auto;margin:0;gap:12px;font-size:9pt;color:#000}
.st .p{flex:1 1 100%;margin:0;font-size:7.5pt;color:#000}
.t,.p{color:#000}.lg{color:#000;font-size:7.5pt;margin:0}
#gr{margin:2px 0 4px;color:#000}#gr svg{background:none;max-height:80mm;border:1px solid #999;border-radius:0}}
</style></head><body>
<h1>Dyeing Program Calculator</h1>
<div class="tabs"><button id="t1" class="on" onclick="tab('calc')">Calc</button><button id="t2" onclick="tab('ed')">Edit</button><button id="t3" onclick="tab('sop')">SOP</button><button id="t4" onclick="tab('saved')">Saved</button><button onclick="window.print()">Print</button></div>

<div id="calc">
<div class="g">
<label>Fabric name<select id="fab"></select></label>
<label>GSM<input id="gsm" type="number" value="180"></label>
<label>Shade<select id="shade"><option value="80">Color (scour 80°C)</option><option value="90">White (scour 90°C)</option></select></label>
<label>Start time<input id="start" type="time" value="08:00"></label>
<label>Steam-up rate °C/min (auto from grade)<input id="rate" type="number" step="0.1"></label>
<label>Run time at dye temp (min)<input id="run" type="number" value="30"></label>
<label>Dye temp °C<input id="tmax" type="number" value="105"></label>
<label style="grid-column:1/-1">Process note<textarea id="pnote" rows="2" placeholder="Note for this process"></textarea></label>
<label id="mgw" hidden>Migration grade °C/min<input id="mgr" type="number" step="0.1"></label>
<label style="flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--fg)"><input type="checkbox" id="gon" checked style="width:auto">Show graph</label>
<label>Graph style<select id="gst"><option value="s">Process sketch (like Unit 2)</option><option value="t">Time vs temp</option></select></label>
</div>
<div class="tot"><span>Total</span><span id="tot"></span></div>
<div id="psum" class="ps"></div>
<div id="pnp" class="ps" style="font-weight:600"></div>
<div id="gr"></div>
<div id="out"></div>
<div class="no"><h2>Save this process</h2><div class="g"><select id="pfolder"><option>Pretreatment &amp; enzyme</option><option selected>Dyeing</option><option>After treatment</option></select><input id="pname" placeholder="Process name"></div><button class="bt" style="width:100%;margin-top:8px" onclick="psave(false)">Save</button><button class="bt" style="width:100%;margin-top:6px" onclick="psave(true)">Save as…</button><div class="p" id="curl"></div></div>
</div>

<div id="ed" hidden>
<div class="p">Change name, time, parallel note. Use ↑ ↓ to move, ✕ to delete, + to add a step below.</div>
<div id="edl"></div>
<button class="bt" style="width:100%" onclick="if(confirm('Reset all steps to default?')){S=DEF();sv(1)}">Reset to default</button>
</div>

<div id="sop" hidden>
<h2>Grade table: fabric name, GSM range, steam-up rate</h2>
<div id="grl"></div>
<div class="bs no"><button class="bt" onclick="gadd()">+ Add grade row</button></div>
<h2>Main program (DF = drain + fill)</h2>
<table id="sopt"></table>
</div>

<div id="saved" hidden>
<div class="p" id="svmsg"></div>
<div id="svl"></div>
<h2>Google Sheet sync (optional)</h2>
<label>Script URL<input id="gurl" placeholder="https://script.google.com/macros/s/.../exec"></label>
<label style="margin-top:6px">Key<input id="gkey"></label>
<div class="bs"><button class="bt" onclick="gsave()">Save settings</button><button class="bt" onclick="gsync()">Sync now</button></div>
<div class="bs"><button class="bt" onclick="gtest()">Test connection</button><button class="bt" onclick="greset()">Reset to built-in URL</button></div>
</div>
<script>
const $=i=>document.getElementById(i),v=i=>+$(i).value;
const DEF=()=>[
{n:'Fill from PT (60°C)',k:'fix',m:5,p:'ADD tank: prep + fill (anticrease, seq/det, MIH)'},
{n:'Inject',k:'fix',m:3,p:''},
{n:'Fabric load + steam to 80°C',k:'fix',m:10,p:'Caustic dosing From ADD2'},
{n:'Dosing H2O2 & Stabilizer',k:'fix',m:5,p:''},
{n:'Steam up 80→{T}°C',k:'steam',p:''},
{n:'Run time at {T}°C',k:'run',p:'PT/ST fill heat to {S}°C'},
{n:'Temp control {T}→80°C + sample',k:'cool',to:80,r:3,x:5,p:'PT fill + heat to 80°C'},
{n:'DF (drain + fill)',k:'fix',m:5,p:''},
{n:'Normal hot 80°C',k:'fix',m:10,p:'PT fill 70°C'},
{n:'DF (drain + fill)',k:'fix',m:5,p:''},
{n:'Block wash 70°C',k:'fix',m:10,p:'PT fill 60°C'},
{n:'DF (drain + fill)',k:'fix',m:5,p:''},
{n:'Overflow wash 60°C',k:'fix',m:10,p:'Prep ADD1 acid (H₂O₂ killer)'},
{n:'DF (drain + fill)',k:'fix',m:5,p:''},
{n:'Inject ADD1',k:'fix',m:3,p:''},
{n:'Run time',k:'fix',m:10,p:''},
{n:'Check pH',k:'fix',m:5,p:''}];
let S;try{S=JSON.parse(localStorage.getItem('dyeSteps2'))}catch(e){}
if(!Array.isArray(S))S=DEF();
S.forEach(s=>{if(/D\/?F/.test(s.n)&&s.m==8)s.m=5});
let manual=false;
function grade(){const f=$('fab').value,g=v('gsm');
 const rs=GR.filter(x=>x.f==f);const m=rs.find(x=>g>=x.a&&g<=x.b)||rs[rs.length-1];if(m)return +m.r;
 return 3}
function tab(n){['calc','ed','sop','saved'].forEach((x,i)=>{$(x).hidden=x!=n;$('t'+(i+1)).className=x==n?'on':''})}
function sv(re){try{localStorage.setItem('dyeSteps2',JSON.stringify(S))}catch(e){}if(re)edit();calc()}
const lbIn=(i,s)=>`<label>Graph label above<input placeholder="auto from name" value="${esc(s.gt!==undefined?s.gt:'')}" oninput="S[${i}].gt=this.value;sv()"></label><label>Graph label below<input placeholder="auto" value="${esc(s.gb!==undefined?s.gb:'')}" oninput="S[${i}].gb=this.value;sv()"></label>`;
const shSel=(i,s)=>`<label>Graph shape<select onchange="S[${i}].sh=this.value;sv()"><option value="">None</option><option value="R"${s.sh=='R'?' selected':''}>Rectangle (linear / recirculation)</option><option value="T"${s.sh=='T'?' selected':''}>Triangle (progressive)</option></select></label>`;
function edit(){$('edl').innerHTML=S.map((s,i)=>{
 let f='';
 if(s.k=='fix')f=`<label>Minutes<input type="number" step="0.5" value="${s.m}" oninput="S[${i}].m=+this.value;sv()"></label>`+shSel(i,s)+lbIn(i,s);
 else if(s.k=='cool')f=`<label>To °C<input type="number" value="${s.to}" oninput="S[${i}].to=+this.value;sv()"></label><label>Rate °C/min<input type="number" step="0.1" value="${s.r}" oninput="S[${i}].r=+this.value;sv()"></label><label>Extra min (sample)<input type="number" value="${s.x}" oninput="S[${i}].x=+this.value;sv()"></label>`;
 else if(s.k=='hold')f=`<label>Hold temp °C<input type="number" value="${s.h}" oninput="S[${i}].h=+this.value;sv()"></label><label>Minutes<input type="number" step="0.5" value="${s.m}" oninput="S[${i}].m=+this.value;sv()"></label>`+shSel(i,s)+lbIn(i,s);
 else if(s.k=='temp')f=`<label>From °C<input type="number" value="${s.from}" oninput="S[${i}].from=+this.value;sv()"></label><label>To °C<input type="number" value="${s.to}" oninput="S[${i}].to=+this.value;sv()"></label><label>Rate °C/min<input type="number" step="0.1" value="${s.r}" oninput="S[${i}].r=+this.value;sv()"></label><label>Extra min<input type="number" value="${s.x}" oninput="S[${i}].x=+this.value;sv()"></label>`;
 else if(s.k=='mig')f=`<label>From °C<input type="number" value="${s.from}" oninput="S[${i}].from=+this.value;sv()"></label><label>Migration °C<input type="number" value="${s.mx}" oninput="S[${i}].mx=+this.value;sv()"></label><label>Hold min<input type="number" step="0.5" value="${s.m}" oninput="S[${i}].m=+this.value;sv()"></label><label>Back to °C<input type="number" value="${s.to}" oninput="S[${i}].to=+this.value;sv()"></label><label>Grade ↑ °C/min<input type="number" step="0.1" value="${s.up}" oninput="S[${i}].up=+this.value;sv()"></label><label>Grade ↓ °C/min<input type="number" step="0.1" value="${s.dn}" oninput="S[${i}].dn=+this.value;sv()"></label>`;
 else f=`<div class="p">${s.k=='steam'?'Time = auto from grade rate':'Time = Run time on Calculator tab'}</div>`;
 return `${addSel(i-1)}<div class="er"><label>${i+1}. Step name<input value="${s.n.replace(/"/g,'&quot;')}" oninput="S[${i}].n=this.value;sv()"></label><div class="g">${f}</div><label style="margin-top:6px">Parallel note<input value="${(s.p||'').replace(/"/g,'&quot;')}" oninput="S[${i}].p=this.value;sv()"></label><div class="bs"><button class="bt" onclick="mv(${i},-1)">↑</button><button class="bt" onclick="mv(${i},1)">↓</button><button class="bt" onclick="S.splice(${i},1);sv(1)">✕</button></div></div>`}).join('')+addSel(S.length-1)}
function mv(i,d){const j=i+d;if(j<0||j>=S.length)return;[S[i],S[j]]=[S[j],S[i]];sv(1)}
const P=[{n:'Fill from PT',k:'fix',m:5,p:''},{n:'Fill',k:'fix',m:5,p:''},{n:'Inject',k:'fix',m:3,p:''},{n:'Dosing',k:'fix',m:5,p:''},{n:'Fabric load + temp control',k:'fix',m:10,p:''},{n:'Temp control',k:'temp',from:60,to:80,r:3,x:0,p:''},{n:'D/F (drain + fill)',k:'fix',m:5,p:''},{n:'Wash (normal hot)',k:'fix',m:10,p:''},{n:'Wash (block)',k:'fix',m:10,p:''},{n:'Wash (over flow)',k:'fix',m:10,p:''},{n:'Linear dosing',k:'fix',m:20,p:''},{n:'Recirculation',k:'fix',m:10,p:''},{n:'Migration (with grade)',k:'mig',from:60,mx:90,m:20,up:1.5,dn:1.5,to:60,g:1,p:''},{n:'Migration at {H}°C',k:'hold',h:105,m:15,p:''},{n:'Progressive dosing',k:'fix',m:30,p:''},{n:'Run time / Hold time at {H}°C',k:'hold',h:105,m:30,p:''}];
// ---- Dyeing process library (copied from Unit 2 Process Browser)
const LG=(m,top,bot)=>({t:'G',m:m||'',top:top||'',bot:bot||''}),LR=(m,top,bot)=>({t:'R',m:m||'',top:top||'',bot:bot||''}),LT=(m,top,bot)=>({t:'T',m:m||'',top:top||'',bot:bot||''}),LM=(top,up,dn,t2)=>({t:'M',top,up,dn,t2}),LU=(top,up,t2)=>({t:'U',top,up,t2});
const LP=(id,title,sub,t0,steps)=>({id,title,sub,t0,steps});
const SODA='SODA (70% PROGRESSIVE)';
const LIBD=[
LP('01','ALL 60 TEMP DYEING PROCESS - 01','FOR ALL LIGHT + MEDIUM + SODA UPTO 8 GPL (BONE+SAND). FOR CVC S/J + FLEECE/TERRY 2 PART + 1 PART CRITICAL COLOUR (LIGHT)',60,[LG('3','LEVEL'),LR('20','COLOUR','LINEAR DOSSING'),LG('12'),LR('10','SALT','LINEAR DOSSING'),LG('15'),LT('45',SODA,'PROGRESSIVE')]),
LP('02','ALL 60 TEMP DYEING PROCESS - 02','FOR ALL CRITICAL COLOUR (2 TIME SODA)',60,[LG('3'),LR('20','COLOUR','LINIAR'),LG('15'),LR('6+3+6','SALT','DOSSING'),LG('15'),LT('20','SODA 70% PROGRESSIVE','1g/l LINEAR'),LG('3'),LT('25','','REST')]),
LP('03','ALL 65 TEMP DYEING PROCESS - 03','ALL BLACK COLOR PROCESS',65,[LG('3','LEVEL'),LR('REC 8','SALT','REC'),LG('10'),LR('20','COLOR','LINEAR DOSSING'),LG('15'),LT('40','Soda 70% Progressive','PROGRESSIVE')]),
LP('04','ALL LIGHT TURQUOISE 80C-80C PROCESS - 04','',80,[LG('5'),LR('20','COLOUR','LINIAR'),LG('20'),LR('10+5+10','SALT (FRESH WATER)','DOSSING'),LG('20'),LT('20','SODA 70% PROGRESSIVE','1G/L'),LG('5'),LT('25','','REST')]),
LP('05','VISCOSE / TENCEL / BAMBOO / SPECIAL FABRIC PROCESS - 05','SALT DOSSING (2 TIME)',60,[LG('10','LEVEL'),LR('30','COLOR','LINEAR'),LG('20'),LR('10','SALT = ½','LINEAR'),LG('5'),LR('10','SALT = ½','LINEAR'),LG('10'),LM('80 X 20’',1.5,1.5,60),LG('10'),LT('20','1ST SODA (1/10)','PROGRESSIVE'),LG('5'),LT('30','2ND SODA','')]),
LP('06','ALL 60 (OCEAN / AM-RL / CORAFIX) TEMP DYEING PROCESS - 06','',60,[LG('5'),LR('20','COLOUR','LINIAR'),LG('15'),LR('5+5+5','SALT','DOSSING'),LG('15'),LT('20','SODA 70% PROGRESSIVE','1G/L'),LG('5'),LT('25','','REST')]),
LP('07','MIGRATION PROCESS - 07','DEEP TURQUOISE 1.0 TO ABOVE & OCEAN/BLUE/NAVY. SALT 3-TIME DOSSING',80,[LG('5','LEVEL'),LR('25','COLOUR','LINEAR DOSSING'),LG('15'),LR('10+5+10+5+10','SALT (FRESH WATER) 3 TIME','LINEAR DOSSING'),LG('5'),LM('90 X 20’',1.5,1.5,80),LG('5'),LT('20','70% PROGRESSIVE','1G/L'),LG('10'),LT('30','','REST 80°C')]),
LP('08','ALL 60-90-60 TEMP DYEING PROCESS - 08','DEEP TURQUOISE MIX OCEAN/NAVY COM, MIGRATION. SALT 2-TIME DOSSING',60,[LG('5','LEVEL'),LR('25','COLOUR','LINEAR DOSSING'),LG('15'),LR('10+5+10','SALT (FRESH WATER) 2 TIME','LINEAR DOSSING'),LG('5'),LM('90 X 15’',1.5,1.5,60),LG('5'),LT('20','70% PROGRESSIVE','1G/L'),LG('5'),LT('25','','REST 60°C')]),
LP('09','COMBINATION MIGRATION PROCESS - 09','YELLOW DS + RED DS + NAVY BLUE KBF (60C-70-60C)',60,[LG('3','LEVEL','REC'),LR('REC-5','SALT','REC'),LG('10'),LR('20','COLOUR','LINIAR DOSSING'),LG('3'),LM('Migration 70°C X 20’',3,3,60),LG('3'),LR('20','1ST SODA','LINIAR 1g/l'),LG('3'),LT('25','2ND SODA','REST 60°C')]),
LP('10','NEW DYEING PROCESS - 10','FOR HELIOTROPE COLOUR / PURPLE TYPE (LIGHT/DEEP)',40,[LG('5'),LR('20','COLOUR','LINIAR'),LG('15'),LR('10+3+10','SALT','DOSSING'),LG('10'),LU('1.0 GRADE',1.0,60),LG('10'),LT('25','SODA 70% PROGRESSIVE','1/20'),LG('5'),LT('30','','19/20')]),
LP('11','ALL 65 TEMP MIXED ALKALI BLACK COLOR PROCESS - 11','',65,[LG('3','LEVEL'),LR('REC-8','SALT','RECIRCULATION'),LG('10'),LR('20','COLOUR','LINEAR DOSSING'),LG('15'),LR('20','SODA ASH','SODA'),LG('3'),LT('25','70% PROGRESSIVE','CAUSTIC PH CHECK')]),
LP('12','ALL 60 TEMP DYEING PROCESS - 12','FOR (60/40) CVC S/J + LY + FLEECE/TERRY 2 PART + 1 PART CRITICAL COLOUR (DARK) + RED + CHARCOAL GREEN TYPE + ABOVE SHADE 3%',60,[LG('3','LEVEL'),LR('REC-08','SALT','RECIRCULATION'),LG('10'),LR('20','COLOR','LINEAR DOSSING'),LG('15'),LT('45',SODA,'PROGRESSIVE')]),
LP('13','FOR NAVY NEW PROCESS - 13','',60,[LG('3','LEVELLING'),LR('REC-8','SALT','RECIRCULATION'),LG('10'),LR('20','COLOUR','LINIAR'),LG('15'),LR('20','SODA','LINIAR 2G/L'),LG('5'),LT('25','SODA 70% PROGRESSIVE','REST 60°C')])];
const tc=s=>String(s||'').toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());
function libSteps(p){let lv=p.t0;const out=[];const mins=m=>(String(m).match(/\d+(\.\d+)?/g)||[]).reduce((a,b)=>a+ +b,0);
 const t2o=s=>(s.t2===''||s.t2==null)?lv:+s.t2;
 p.steps.forEach(s=>{
  if(s.t==='M'){const mm=/(\d+(?:\.\d+)?)\s*°?\s*C?\s*X\s*(\d+(?:\.\d+)?)/i.exec(s.top||'');const X=mm?+mm[1]:lv,hd=mm?+mm[2]:0,t2=t2o(s);
   out.push({n:'Migration '+X+'°C × '+hd+'’',k:'mig',from:lv,mx:X,m:hd,up:+s.up||1,dn:+s.dn||1,to:t2,g:1,p:''});lv=t2}
  else if(s.t==='U'){const t2=t2o(s);out.push({n:'Ramp '+tc(s.top)+' to '+t2+'°C',k:'temp',from:lv,to:t2,r:+s.up||1,x:0,g:1,p:''});lv=t2}
  else out.push({n:tc([s.top,s.bot].filter(Boolean).join(' – '))||(s.t==='R'?'Linear dosing':s.t==='T'?'Progressive':'Hold'),k:'hold',h:lv,m:mins(s.m),gt:tc(s.top),gb:tc(s.bot),sh:s.t==='R'?'R':(s.t==='T'&&/SODA|PROGRESSIVE/i.test((s.top||'')+' '+(s.bot||'')))?'T':'',p:''})});
 return out}
function libTot(st){return st.reduce((a,s)=>a+(s.k=='hold'?+s.m:s.k=='mig'?Math.abs(s.mx-s.from)/s.up+(+s.m)+Math.abs(s.mx-s.to)/s.dn:Math.abs(s.to-s.from)/s.r+(+s.x||0)),0)}
function hmm(m){m=Math.round(m);const h=Math.floor(m/60);return h?h+'h '+(m%60)+'m':m+'m'}
function libNote(p,st){if(p.sub)return tc(p.sub);return 'Start '+p.t0+'°C. '+st.filter(x=>x.sh).map(x=>x.n+' '+x.m+'’').join(' → ')}
function llib(id){const p=LIBD.find(x=>x.id==id);if(!p)return;CUR=null;S=libSteps(p);$('tmax').value=Math.max(p.t0,...S.map(s=>s.mx||s.to||s.h||0));$('pname').value=tc(p.title);$('pfolder').value='Dyeing';$('pnote').value=libNote(p,S);sv(1);curLabel();tab('calc')}
let H=0,PR=[];try{PR=JSON.parse(localStorage.getItem('dyeProcs'))||[]}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pstore(){try{localStorage.setItem('dyeProcs',JSON.stringify(PR))}catch(e){}}
let CUR=null;
